<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CycleWire social preview</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            width: 1280px;
            height: 640px;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #e8ebf0;
            background:
                radial-gradient(900px 480px at 88% -10%, rgba(94, 234, 212, .18), transparent 60%),
                radial-gradient(700px 420px at -5% 110%, rgba(167, 139, 250, .16), transparent 60%),
                #0a0c10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 72px 84px 64px;
        }
        .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 750; letter-spacing: -.02em; }
        .brand svg { width: 64px; height: 64px; }
        h1 { margin: 0; font-size: 92px; line-height: 1.02; font-weight: 820; letter-spacing: -.045em; max-width: 1000px; }
        h1 span { background: linear-gradient(95deg, #5eead4, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .points { display: flex; gap: 14px; margin-top: 30px; }
        .points span { padding: 10px 18px; border-radius: 999px; border: 1px solid #333c4a; background: rgba(23, 28, 37, .8); font-size: 24px; color: #c9d0db; }
        footer { display: flex; justify-content: space-between; align-items: center; font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #a0a9b8; }
        footer code { padding: 12px 18px; border-radius: 12px; background: #0b0f15; border: 1px solid #333c4a; color: #e6edf3; }
        footer code::before { content: "$ "; color: #7d8590; }
    </style>
</head>
<body>
    <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f766e"/><path d="M6 20h6l3-8 3 8h8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="12" r="2.4" fill="#fbbf24"/></svg>
        CycleWire
    </div>
    <div>
        <h1>Server-rendered HTML, <span>wired on intent.</span></h1>
        <div class="points"><span>No hydration</span><span>Code loads on intent</span><span>Zero dependencies</span><span>Any backend</span></div>
    </div>
    <footer>
        <span>cyclechain.github.io/CycleWire</span>
        <code>npm i cyclewire</code>
    </footer>
</body>
</html>
