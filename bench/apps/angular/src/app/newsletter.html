<section class="newsletter" aria-labelledby="newsletter-title">
  <h2 id="newsletter-title">Get the Wirestore letter</h2>
  <p>New arrivals and restocks, once a month.</p>
  <form id="newsletter" action="/newsletter" method="post" (submit)="subscribe($event, email.value)">
    <label for="email">Email</label>
    <div class="newsletter__row">
      <input #email id="email" name="email" type="email" required autocomplete="email" /><button>Subscribe</button>
    </div>
  </form>
  <p id="newsletter-status" role="status">{{ status() }}</p>
</section>
