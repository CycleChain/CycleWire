<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CycleWire</title>
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
        {
            "imports": {
                "cyclewire": "https://cdn.jsdelivr.net/npm/cyclewire@1/dist/cyclewire.min.js",
                "cyclewire/dom": "https://cdn.jsdelivr.net/npm/cyclewire@1/dist/dom.min.js"
            }
        }
    </script>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/cyclewire@1/dist/cyclewire.min.js">
    <script type="module">
        import { start } from 'cyclewire';

        // Names in the markup, and the files they load. Relative URLs resolve against this page.
        start({ actions: { like: './actions/like.js', search: './actions/search.js' } });
    </script>
</head>
<body>
    <main>
        <h1>Hello, CycleWire</h1>
        <p>No build step: CycleWire comes from a CDN, and each action's file loads when you reach for it.</p>

        <button type="button" class="like" data-cw-action="like" aria-pressed="false">
            ♥ Like <span class="like__count">12</span>
        </button>

        <label for="search">Filter the list</label>
        <input id="search" type="search" autocomplete="off" data-cw-action="search" data-cw-debounce="100"
               data-cw-props='{"list": "tools"}'>
        <ul id="tools">
            <li>Vite</li>
            <li>Astro</li>
            <li>Laravel</li>
            <li>Rails</li>
            <li>Django</li>
        </ul>
        <p id="tools-count" aria-live="polite">5 of 5</p>
    </main>
</body>
</html>
