# Updates for the workflows' actions and every package.json in the repository.
# CycleWire itself has no runtime dependencies. Major versions of the tools the
# apps and templates are built with (TypeScript, Vite, a framework) change how
# they build, so they are taken on purpose, not by a weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      development:
        dependency-type: development
    ignore:
      # The types follow the oldest Node the tooling supports (22), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # The documentation site and the starter templates.
  - package-ecosystem: npm
    directories:
      - /docs-site
      - /packages/create-cyclewire
      - /packages/create-cyclewire/templates/astro
      - /packages/create-cyclewire/templates/vanilla
      - /packages/create-cyclewire/templates/vite
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      all:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  # The benchmark's runner, weekly: Playwright brings the browser it measures with.
  - package-ecosystem: npm
    directory: /bench
    schedule:
      interval: weekly
    commit-message:
      prefix: build(bench)
    groups:
      runner:
        patterns: ['*']
  # The benchmark's apps, monthly, one pull request per app: a new release of a
  # stack is measured once it has had time to settle, and the Benchmark
  # workflow checks that the app still builds the same page.
  - package-ecosystem: npm
    directories:
      - /bench/apps/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    commit-message:
      prefix: build(bench)
    groups:
      app:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
