name: Release

# Pushing a tag such as v1.2.0 verifies the commit, publishes it to npm through
# trusted publishing (OIDC, with provenance) and creates the GitHub Release.
# See docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:es
      - run: npm run size
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  publish:
    name: Publish ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@12
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "cyclewire@$version" version > /dev/null 2>&1; then
            echo "cyclewire@$version is already on npm; skipping."
            exit 0
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # The verify job already built and tested this commit.
          npm publish --provenance --access public --tag "$tag" --ignore-scripts
      - name: Fetch the published package
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            npm pack "cyclewire@$version" --pack-destination "$RUNNER_TEMP" > /dev/null 2>&1 && break
            sleep 10
          done
          tar -xzf "$RUNNER_TEMP/cyclewire-$version.tgz" -C "$RUNNER_TEMP"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes and SRI hashes come from the files npm (and every CDN) serves.
          node scripts/release-notes.js "$GITHUB_REF_NAME" "$RUNNER_TEMP/package/dist" > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/package/dist/*.min.js \
            --title "CycleWire $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag $prerelease
