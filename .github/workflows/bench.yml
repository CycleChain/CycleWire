name: Benchmark

# check:   on changes to bench/, the harness's tests, the conformance check for
#          every stack, and a short run (one journey and the early tap) to prove
#          the pipeline works.
# measure: by hand or weekly, the full run for each profile, kept as artifacts.
# publish: when every profile was measured and the repository variable
#          BENCH_PUBLISH is 'true', a pull request from github-actions[bot]
#          replaces bench/results/ with the new runs and updates the README's
#          tables; merging it redeploys the website's Benchmark section. It
#          needs "Allow GitHub Actions to create and approve pull requests" in
#          the repository settings. See bench/README.md.

on:
  # The CycleWire app is built from this repository's source, so changes to
  # the library are checked too.
  pull_request:
    paths: ['bench/**', 'src/**', 'package.json', 'scripts/build.js', '.github/workflows/bench.yml']
  push:
    branches: [main]
    paths: ['bench/**', 'src/**', 'package.json', 'scripts/build.js', '.github/workflows/bench.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Profile
        type: choice
        options: [both, mobile, desktop]
        default: both
      iterations:
        description: Iterations per stack and visit
        default: '15'
      stacks:
        description: Stacks, comma-separated (empty for all)
        default: ''
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: bench

jobs:
  check:
    name: Conformance and a short run
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/apps/*/package-lock.json
      - name: Build CycleWire, which the CycleWire app links to
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node run.js --check
      - name: A short run
        run: node run.js --iterations=1 --kinds=journeys,early --journeys=cart --skip-build --out=results/check.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-check
          path: bench/results/check.json
          if-no-files-found: ignore
          retention-days: 14

  measure:
    name: Measure (${{ matrix.profile }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == 'mobile' && '["mobile"]') || (inputs.profile == 'desktop' && '["desktop"]') || '["mobile","desktop"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/apps/*/package-lock.json
      - name: Build CycleWire, which the CycleWire app links to
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure
        # Shorter than the job, so the results saved after each iteration are
        # still uploaded when a run is too slow to finish.
        timeout-minutes: 320
        env:
          PROFILE: ${{ matrix.profile }}
          ITERATIONS: ${{ inputs.iterations || '15' }}
          STACKS: ${{ inputs.stacks }}
        run: |
          out="results/$(date -u +%Y-%m-%d)-$PROFILE.json"
          node run.js --profile="$PROFILE" --iterations="$ITERATIONS" ${STACKS:+--stacks="$STACKS"} --out="$out"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.profile }}
          path: bench/results/*.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Propose the results
    needs: measure
    if: vars.BENCH_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          path: new-results
          merge-multiple: true
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="bench/results-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          find bench/results -name '*.json' -delete
          cp new-results/*.json bench/results/
          node bench/scripts/readme.js --write
          git add -A bench/results README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(bench): results from run $GITHUB_RUN_ID"
          git push origin "$branch"
          label=""
          if gh label list --search bench --json name --jq '.[].name' | grep -qx bench; then label="--label bench"; fi
          gh pr create --base main --head "$branch" $label \
            --title "Benchmark results, $(date -u +%Y-%m-%d)" \
            --body "Results of $RUN_URL. Merging this redeploys the website's Benchmark section. Check the conformance section and the failed visits in each file before merging."
