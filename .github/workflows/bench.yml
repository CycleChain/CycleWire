name: Benchmark

# check:   on changes to bench/, the harness's tests, the conformance check for
#          every stack a change can affect (scripts/changed.js), and a short
#          run (one journey and two early taps) to prove the pipeline works.
# measure: by hand or weekly, the full run for each profile, in two parts on
#          two runners, every stack in each: the journeys (with the loads they
#          start with), and the early taps with the repeat visits. A part keeps
#          one machine behind each metric, and neither comes near the job
#          time limit.
# merge:   joins each profile's parts into one results file (scripts/merge.js),
#          kept as an artifact, and says in its summary what changed since the
#          published run (scripts/drift.js), so drift in the runners or in
#          Chrome is seen before it is read as a change in a stack.
# crosscheck: next to measure, Lighthouse and the harness's cold load in turn on
#          one runner, to check the harness's load metrics (crosscheck/run.js);
#          the table is in the job's summary.
# micro:   by hand or weekly, the micro benchmarks (micro/): cyclewire/signals
#          next to Preact Signals, alien-signals and Vue's reactivity in Node,
#          and cyclewire/morph next to morphdom and idiomorph in Chromium,
#          Firefox and WebKit. The report is in the job's summary; the JSON is
#          kept as an artifact.
# publish: when every profile was measured and the repository variable
#          BENCH_PUBLISH is 'true', a pull request from github-actions[bot]
#          replaces bench/results/ with the new runs and updates the README's
#          tables; merging it redeploys the website's Benchmark section. It
#          needs "Allow GitHub Actions to create and approve pull requests" in
#          the repository settings. See bench/README.md.

on:
  # The CycleWire app is built from this repository's source, so changes to
  # the library are checked too.
  pull_request:
    paths: ['bench/**', 'src/**', 'package.json', 'scripts/build.js', '.github/workflows/bench.yml']
  push:
    branches: [main]
    paths: ['bench/**', 'src/**', 'package.json', 'scripts/build.js', '.github/workflows/bench.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: Profile
        type: choice
        options: [both, mobile, desktop]
        default: both
      iterations:
        description: Iterations per stack and visit
        default: '15'
      stacks:
        description: Stacks, comma-separated (empty for all)
        default: ''
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: bench

jobs:
  check:
    name: Conformance and a short run
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/apps/*/package-lock.json
      - name: Build CycleWire, which the CycleWire app links to
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # A pull request that changes only some apps checks those apps and their
      # variants; anything else (the runner, the scenario, the library, a push
      # to main) checks every stack.
      - name: Which stacks to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          stacks=""
          if [ -n "$PR" ]; then stacks=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | node scripts/changed.js); fi
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks to check: ${stacks:-all}"
      - name: Conformance
        if: steps.scope.outputs.stacks != 'none'
        env:
          STACKS: ${{ steps.scope.outputs.stacks }}
        run: node run.js --check ${STACKS:+--stacks="$STACKS"}
      - name: A short run
        if: steps.scope.outputs.stacks != 'none'
        env:
          STACKS: ${{ steps.scope.outputs.stacks }}
        run: node run.js --iterations=1 --kinds=journeys,early --journeys=cart --offsets=0,1000 --skip-build ${STACKS:+--stacks="$STACKS"} --out=results/check.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-check
          path: bench/results/check.json
          if-no-files-found: ignore
          retention-days: 14

  measure:
    name: Measure (${{ matrix.profile }}, ${{ matrix.part }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == 'mobile' && '["mobile"]') || (inputs.profile == 'desktop' && '["desktop"]') || '["mobile","desktop"]') }}
        part: [journeys, taps]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/apps/*/package-lock.json
      - name: Build CycleWire, which the CycleWire app links to
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure
        # Shorter than the job, so the results saved after each iteration are
        # still uploaded when a run is too slow to finish.
        timeout-minutes: 320
        env:
          PROFILE: ${{ matrix.profile }}
          PART: ${{ matrix.part }}
          ITERATIONS: ${{ inputs.iterations || '15' }}
          STACKS: ${{ inputs.stacks }}
        run: |
          kinds=$([ "$PART" = journeys ] && echo journeys || echo early,repeat)
          node run.js --profile="$PROFILE" --kinds="$kinds" --iterations="$ITERATIONS" ${STACKS:+--stacks="$STACKS"} --out="parts/$PROFILE-$PART.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-part-${{ matrix.profile }}-${{ matrix.part }}
          path: bench/parts/*.json
          if-no-files-found: ignore
          retention-days: 30

  merge:
    name: Merge (${{ matrix.profile }})
    needs: measure
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == 'mobile' && '["mobile"]') || (inputs.profile == 'desktop' && '["desktop"]') || '["mobile","desktop"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-part-${{ matrix.profile }}-*
          path: bench/parts
          merge-multiple: true
      - name: Merge the parts
        run: |
          mkdir -p merged
          node scripts/merge.js --out-dir=merged parts/${{ matrix.profile }}-*.json
      - name: What changed since the published run
        run: node scripts/drift.js merged/*.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.profile }}
          path: bench/merged/*.json
          retention-days: 90

  crosscheck:
    name: Lighthouse cross-check (${{ matrix.profile }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile == 'mobile' && '["mobile"]') || (inputs.profile == 'desktop' && '["desktop"]') || '["mobile","desktop"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/crosscheck/package-lock.json
            bench/apps/*/package-lock.json
      - name: Build CycleWire, which the CycleWire app links to
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci
        working-directory: bench/crosscheck
      - name: Cross-check
        working-directory: bench/crosscheck
        env:
          PROFILE: ${{ matrix.profile }}
          STACKS: ${{ inputs.stacks }}
        run: node run.js --profile="$PROFILE" --runs=5 ${STACKS:+--stacks="$STACKS"} --out="out/$PROFILE.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-crosscheck-${{ matrix.profile }}
          path: bench/crosscheck/out/*.json
          if-no-files-found: ignore
          retention-days: 90

  micro:
    name: Micro benchmarks (signals and morph)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/micro/package-lock.json
      - name: Build CycleWire, which the micro benchmarks import
        working-directory: .
        run: npm ci && npm run build
      # The harness's Playwright and Ajv.
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm ci
        working-directory: bench/micro
      - run: npm test
        working-directory: bench/micro
      - name: Measure
        working-directory: bench/micro
        run: node run.js --suite=all --browsers=chromium,firefox,webkit --samples=30 --warmup=5 --out=out/micro.json
      - name: Report
        if: always()
        working-directory: bench/micro
        run: |
          if [ -f out/micro.json ]; then node report.js out/micro.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-micro
          path: bench/micro/out/*.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Propose the results
    needs: merge
    if: vars.BENCH_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-results-*
          path: new-results
          merge-multiple: true
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="bench/results-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          find bench/results -name '*.json' -delete
          cp new-results/*.json bench/results/
          node bench/scripts/readme.js --write
          git add -A bench/results README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(bench): results from run $GITHUB_RUN_ID"
          git push origin "$branch"
          label=""
          if gh label list --search bench --json name --jq '.[].name' | grep -qx bench; then label="--label bench"; fi
          gh pr create --base main --head "$branch" $label \
            --title "Benchmark results, $(date -u +%Y-%m-%d)" \
            --body "Results of $RUN_URL. Merging this redeploys the website's Benchmark section. Check the conformance section and the failed visits in each file before merging."
