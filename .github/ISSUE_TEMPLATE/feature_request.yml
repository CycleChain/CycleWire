name: Feature request
description: Propose an addition or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation you are in, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or markup
      render: html
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
