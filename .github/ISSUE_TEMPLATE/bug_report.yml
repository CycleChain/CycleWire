name: Bug report
description: Something in CycleWire does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Security issues go through SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: CycleWire version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How do you load it?
      options:
        - npm + bundler
        - ES module from a CDN
        - Classic script (cyclewire.global.min.js)
        - Classic script, full build
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 26.1, Chrome 153, …
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest markup and action code that shows the problem. A link to a repository or a CodePen is ideal.
      render: html
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
