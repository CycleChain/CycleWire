<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CycleWire full classic-script fixture</title>
    <script src="/fixtures/harness.js"></script>
    <script type="application/json" data-cyclewire>
        {
            "actions": {
                "widget": { "module": "/fixtures/actions/styled.js", "css": "/fixtures/styles/widget.css" },
                "state": "/fixtures/actions/state.js"
            },
            "streams": { "channels": { "feed": "/sse/listen?channel=full-fixture" } },
            "request": true
        }
    </script>
    <script src="/dist/cyclewire.full.global.min.js"></script>
</head>
<body>
    <div id="widget" cw-action="widget" cw-trigger="load">widget</div>
    <section cw-state='{"count": 2}'>
        <output id="count" cw-bind="text: count">2</output>
        <button id="inc" cw-action="state#inc">+1</button>
    </section>
    <ul id="feed" cw-stream="feed"></ul>
    <button id="bump" type="button" cw-action="request" cw-get="/fixtures/partials/counter.html" cw-target="#counter" cw-swap="morph">Bump</button>
    <div id="counter"><input id="keep" aria-label="Keep"><span>0</span></div>
</body>
</html>
